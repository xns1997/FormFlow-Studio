name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
        with: { version: 11.4.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-service/requirements.txt
      - run: python -m pip install -r python-service/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: docker build -t formflow-release-smoke .
      - name: Smoke-test production image and catalogs
        run: |
          set -euo pipefail
          container_name=formflow-release-smoke
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs "$container_name" || true
            fi
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          docker run -d \
            --name "$container_name" \
            -p 3001:3001 \
            -e FORMFLOW_MODE=local \
            -e FORMFLOW_DATABASE_REQUIRED=false \
            -e FORMFLOW_DATABASE_AUTO_START=false \
            -e JWT_SECRET=formflow-release-smoke-only \
            formflow-release-smoke
          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health; then
              healthy=true
              break
            fi
            sleep 1
          done
          test "$healthy" = true
          test "$(docker exec "$container_name" sh -c 'find /app/ui/src/designer/controls -name "*.tsx" | wc -l')" -gt 0
          test "$(docker exec "$container_name" sh -c 'find /app/ui/nodes -name schema.json | wc -l')" -gt 0
      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
